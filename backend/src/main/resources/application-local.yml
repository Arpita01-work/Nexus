spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nexus?options=-c%20TimeZone=Asia/Kolkata
    username: postgres
    password: postgres

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: INFO